name: Makersite
description: >-
  Makersite is an AI-powered Product Lifecycle Intelligence platform that helps
  manufacturers manage product sustainability, cost, and compliance by
  connecting products to deep-tier supply chain, material, and chemical data.
  The platform automates lifecycle assessments (LCA) and product carbon
  footprint (PCF) calculations, supports eco-design and cost optimization, and
  produces regulatory reporting such as EU Taxonomy and CBAM. It integrates with
  enterprise CAD, ERP, and PLM systems (PTC Windchill, Siemens Teamcenter,
  Autodesk, ANSYS). Makersite is a portfolio company of Partech. As of this
  enrichment pass it publishes no public developer API or developer portal.
